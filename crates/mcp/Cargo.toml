[package]
name = "mimvox-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for Mimvox, a client of its local HTTP API"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
mimvox-engine-client.workspace = true
mimvox-api.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "io-std"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
axum = "0.8.9"
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = { version = "0.3.34", default-features = false }
base64 = "0.23.1"
dirs = "6"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version info into the Windows executable (see build.rs).
winresource = "0.1"
