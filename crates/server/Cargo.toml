[package]
name = "mimvox-server"
version = "0.1.0"
edition = "2024"
description = "Mimvox local HTTP API, without the window"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
mimvox-engine-client.workspace = true
mimvox-api.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
clap = { version = "4.6.8", features = ["derive"] }
axum = "0.8.9"
tokio-util = "0.7.20"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
tempfile = "3.27.0"
futures-util = { version = "0.3.34", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version info into the Windows executable (see build.rs).
winresource = "0.1"
