[package]
name = "mimvox-api"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
mimvox-engine-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "fs", "io-util", "net", "macros", "time"] }
axum = "0.8.9"
tokio-util = { version = "0.7.20", features = ["io"] }
futures-util = { version = "0.3.34", default-features = false }
base64 = "0.23.1"
getrandom = "0.4.3"
subtle = "2.6.1"
uuid = { version = "1.29.3", features = ["v4"] }
