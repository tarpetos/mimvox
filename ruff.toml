line-length = 120
target-version = "py310"
extend-exclude = ["app/vendor"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
# zip(strict=...) would change behaviour or just add noise; the lengths are checked where it matters.
ignore = ["B905"]

[lint.isort]
# Standard library from 3.11, the version setup installs.
extra-standard-library = ["tomllib"]
