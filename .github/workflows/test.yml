name: Tests

on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        default: false
      engine:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        if: inputs.rust

      # The integration tests run crates/desktop/examples/fake_engine.py with the first Python 3 on PATH.
      - name: Python
        if: inputs.rust
        run: python3 --version || python --version

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.rust

      - uses: Swatinem/rust-cache@v2
        if: inputs.rust

      - name: Linux build dependencies
        if: inputs.rust && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev

      - name: cargo test
        if: inputs.rust
        run: cargo test --workspace

  python:
    name: Python (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        if: inputs.engine

      - uses: astral-sh/setup-uv@v10.3.3
        if: inputs.engine

      - name: pytest
        if: inputs.engine
        env:
          UV_PYTHON: "3.14"
        run: uv run --group test pytest
