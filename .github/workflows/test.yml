name: Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        env:
          PATTERN: '^app/|^crates/|(^|/)(Cargo\.toml|Cargo\.lock)$|^\.github/workflows/test\.yml$'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Rust changes."
          fi

      - name: Rust
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev

      - name: cargo test
        if: steps.changes.outputs.run == 'true'
        run: cargo test --workspace
