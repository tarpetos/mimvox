# Builds the desktop installers on GitHub-hosted runners (free for public repositories) with the scripts in
# scripts/build/, and publishes them as a GitHub Release when a version tag is pushed.
#
#   git tag v0.1.6 && git push origin v0.1.6   build every installer and publish the pre-release "Mimvox 0.1.6"
#                                              (notes: that version's section of CHANGELOG.md)
#   Actions > Build installers > Run workflow  build every installer; download them from the run's artifacts
#   a pull request that touches the build      build every installer as a check (nothing is published)
#
# Targets: Windows x64 and ARM64 (NSIS setup .exe and .msi), Linux x64 and ARM64 (AppImage and .deb), macOS
# universal (one .dmg for Apple Silicon and Intel). The installers carry only the app and the engine sources; the
# app's first-run setup downloads Python, PyTorch and the models.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/build/**"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "app/Packager.toml"
      - "app/build.rs"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # GitHub's standard runners have 4 cores (3 on Apple Silicon); the scripts default to 6 jobs.
  CARGO_BUILD_JOBS: "4"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            kind: windows
          - name: Windows ARM64
            os: windows-11-arm
            kind: windows
          # 22.04 (glibc 2.35) so the AppImage also runs on older distributions.
          - name: Linux x64
            os: ubuntu-22.04
            kind: linux
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            kind: linux
          - name: macOS universal
            os: macos-latest
            kind: macos
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.os }}

      - name: uv
        uses: astral-sh/setup-uv@v6

      - name: Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev file

      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/build/build-win.ps1 -Format both

      - name: Build (Linux)
        if: matrix.kind == 'linux'
        run: ./scripts/build/build-linux.sh

      - name: Build (macOS)
        if: matrix.kind == 'macos'
        run: ./scripts/build/build-mac.sh --universal --formats app,dmg

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' app/Cargo.toml | head -n1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Release notes and checksums
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --prerelease --title "Mimvox $VERSION" --notes-file notes.md
          fi
