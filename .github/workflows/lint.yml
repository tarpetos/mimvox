name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.17.5"
  CARGO_TERM_COLOR: always

# Each job checks for relevant changes itself instead of using `paths:` filters, so both checks always report a
# result and can be made required.
jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        env:
          PATTERN: '\.py$|(^|/)(ruff\.toml|pyproject\.toml)$|^\.github/workflows/lint\.yml$'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Python changes."
          fi

      - name: uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.3.3

      - name: ruff check
        if: steps.changes.outputs.run == 'true'
        run: uvx "ruff@$RUFF_VERSION" check --output-format github .

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Changes
        id: changes
        env:
          PATTERN: '^app/|^crates/|(^|/)(Cargo\.toml|Cargo\.lock|rustfmt\.toml)$|^\.github/workflows/lint\.yml$'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Rust changes."
          fi

      - name: Rust
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        if: steps.changes.outputs.run == 'true'
        run: cargo fmt --all --check

      - name: Rust cache
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev

      - name: cargo clippy
        if: steps.changes.outputs.run == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
