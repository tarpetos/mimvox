name: Lint

on:
  workflow_call:
    inputs:
      python:
        type: boolean
        default: false
      rust:
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.5"
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python
    if: inputs.python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: ruff check
        run: uvx "ruff@$RUFF_VERSION" check --output-format github .

  rust:
    name: Rust (${{ matrix.name }})
    if: inputs.rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

