name: CI

# Entry point for every pull request check: lint.yml and test.yml run from here. A title edit re-runs only the title check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|build|ci|chore|revert'
          scopes='app|engine|setup|build|ci|docs|release|deps'
          pattern="^(${types})(\((${scopes})\))?!?: [A-Za-z0-9\`].*[^.]$"
          echo "Title: $TITLE"
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::The title must look like 'type(scope): summary', for example 'fix(app): keep the player bar on Stop'."
            echo "Types: ${types//|/, }. Scopes (optional): ${scopes//|/, }."
            echo "The summary has no full stop at the end. See CONTRIBUTING.md, 'Commit messages'."
            exit 1
          fi

  changes:
    name: Changes
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
      engine: ${{ steps.diff.outputs.engine }}
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Changed files
        id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          check() { if grep -qE "$2" <<< "$files"; then echo "$1=true" >> "$GITHUB_OUTPUT"; fi; }
          check python '\.py$|^pyproject\.toml$|^\.github/workflows/(ci|lint)\.yml$'
          check engine '^engine/.*\.py$|^(pyproject\.toml|uv\.lock)$|^\.github/workflows/(ci|test)\.yml$'
          check rust '^crates/|(^|/)(Cargo\.toml|Cargo\.lock|rustfmt\.toml)$|^\.github/workflows/(ci|lint|test)\.yml$'

  lint:
    name: Lint
    needs: changes
    uses: ./.github/workflows/lint.yml
    with:
      python: ${{ needs.changes.outputs.python == 'true' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  test:
    name: Tests
    needs: changes
    uses: ./.github/workflows/test.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
      engine: ${{ needs.changes.outputs.engine == 'true' }}

  result:
    name: CI result
    if: always()
    needs: [title, changes, lint, test]
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Every job passed or was skipped
        if: github.event.action != 'edited'
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then exit 1; fi
          done

      - name: The title passed and the code checks of this commit passed
        if: github.event.action == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.title.result }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$TITLE" = success ] || exit 1
          last=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=CI%20result" \
            --jq '[.check_runs[] | select(.status == "completed" and .conclusion != "skipped")] | sort_by(.completed_at) | last | .conclusion')
          echo "Last code result: $last"
          [ "$last" = success ]
