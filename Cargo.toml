[workspace]
resolver = "3"
members = ["crates/desktop", "crates/engine-client", "crates/api", "crates/server", "crates/mcp"]
exclude = ["crates/desktop/vendor"]

[workspace.dependencies]
mimvox-engine-client = { path = "crates/engine-client" }
mimvox-api = { path = "crates/api" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.54"

[profile.release]
lto = "thin"
codegen-units = 1

# Rune with a small patch for the caption buttons (see crates/desktop/vendor/README.md): remove once upstream has an
# equivalent.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "crates/desktop/vendor/rune-patched" }
