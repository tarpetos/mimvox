[package]
name = "mimvox"
version = "0.3.1"
edition = "2024"
description = "Clone your own voice and speak any text with it"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[[bin]]
name = "mimvox"
path = "src/main.rs"

[dependencies]
# Rune is pre-release: pinned to a dev revision. Bump deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7cea1692a8ce68b1b63c46688c493bb94a8456d" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
cpal = "0.15"
hound = "3"
# Native folder picker for the install location (onboarding).
rfd = "0.15"
# Self-update from the signed installers of each GitHub release (see src/update.rs).
cargo-packager-updater = "0.2.3"
# Unpacks the gzipped uv of the Linux installers (see src/ui/setuprun.rs).
flate2 = "1"

[target.'cfg(windows)'.dependencies]
# The named mutex the installer and the uninstaller look for (AppMutex): "Mimvox is running" (see src/main.rs).
# ... and the seek strip, the player's knob in a small window of its own (see src/ui/seekstrip.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Marks the AppImage runtime's descriptors close-on-exec (see keep_appimage_fds_to_self in src/main.rs).
libc = "0.2"

[build-dependencies]
# Embeds assets/icon.ico (and version info) into the Windows executable; build.rs does nothing on other targets.
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Rune with a small patch for the caption buttons (see vendor/README.md): remove once upstream has an equivalent.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "vendor/rune-patched" }
